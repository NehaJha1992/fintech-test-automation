[pytest]
testpaths = tests
addopts =
    -ra
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --tracing retain-on-failure
    --output reports/playwright
markers =
    smoke: fast checks of the most important paths
    api: API-level tests
    ui: browser tests
    negative: invalid input and error handling
    security: authentication and authorization
